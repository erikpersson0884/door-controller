services:
  door-app:
    container_name: door_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      UNLOCK_URL: ${UNLOCK_URL}
      DOORS: ${DOORS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      UNLOCK_PASSWORD_DB_PATH: ${UNLOCK_PASSWORD_DB_PATH:-/data/door-controller.sqlite}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - door-controller-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.doorapp.rule=Host(`door.erik-persson.com`)"
      - "traefik.http.routers.doorapp.entrypoints=web"
      - "traefik.http.services.doorapp.loadbalancer.server.port=80"
    restart: unless-stopped

volumes:
  door-controller-data: